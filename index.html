<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>C101 · Learn Chinese</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HOME -->
  <section id="home" class="screen active">
    <header class="app-header">
      <div class="header-left">
        <div id="lang-select" class="lang-select"></div>
        <div class="brand">課程 101</div>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-ico">🔥</span><span id="stat-streak">0</span></div>
        <div class="stat"><span class="stat-ico">⭐</span><span id="stat-xp">0</span></div>
      </div>
    </header>

    <main class="home-main">
      <!-- Book (module) picker: one selectable book per tab; hidden if only one -->
      <div id="book-tabs" class="book-tabs" role="tablist"></div>
      <button id="review-btn" class="review-btn">Review</button>
      <div id="chapter-list" class="chapter-list"></div>
      <p class="tagline">Vocabulary from <em>Course 101: Christian Foundations</em>.</p>
      <!-- Filled in from CONFIG.BUILD by UI.init. Read this before debugging a
           "the change didn't land" report — it says what this device is running. -->
      <p id="build-stamp" class="build-stamp"></p>
    </main>

    <!-- Chapter rail: a mini-map of the path. Tap a tick to jump, drag to scrub.
         Pointer-only by design; the Jump menu below is the keyboard/AT route. -->
    <div id="path-rail" class="path-rail" hidden aria-hidden="true"></div>

    <!-- Jump-to control: scroll the path to the current lesson or a chapter -->
    <button id="jump-btn" class="jump-btn" aria-haspopup="true" aria-expanded="false">
      <span class="jump-ico">🧭</span><span>Jump</span>
    </button>
    <ul id="jump-menu" class="jump-menu" role="menu" hidden></ul>
  </section>

  <!-- MODAL: reading passage / section vocab list (opens over the home path) -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- SESSION -->
  <section id="session" class="screen">
    <header class="session-top">
      <button id="session-exit" class="exit" aria-label="Exit lesson">✕</button>
      <div class="bar session-bar"><div id="session-bar-fill" class="bar-fill"></div></div>
    </header>
    <main id="session-stage" class="session-stage"></main>
    <footer id="session-foot" class="session-foot"></footer>
  </section>

  <!-- RESULTS -->
  <section id="results" class="screen">
    <canvas id="results-fx" class="results-fx" aria-hidden="true"></canvas>
    <main class="results-main">
      <div class="results-emoji">🎉</div>
      <h1 id="results-title">Lesson complete!</h1>
      <div id="results-body" class="results-body"></div>
      <button id="results-done" class="continue">Continue</button>
    </main>
  </section>

  <!-- load order = dependency order -->
  <script src="src/config.js"></script>
  <script src="src/content.js"></script>
  <script src="content/chapter-01.js"></script>
  <script src="content/gnr-chapter-01.js"></script>
  <script src="content/gnr-chapter-02.js"></script>
  <script src="content/gnr-chapter-03.js"></script>
  <script src="content/gnr-chapter-04.js"></script>
  <script src="content/gnr-chapter-05.js"></script>
  <script src="content/gnr-chapter-06.js"></script>
  <script src="content/gnr-chapter-07.js"></script>
  <script src="content/gnr-reference.js"></script>
  <script src="content/basics-01-sounds.js"></script>
  <script src="content/basics-02-tones.js"></script>
  <script src="content/basics-03-radicals.js"></script>
  <script src="content/basics-04-core.js"></script>
  <script src="src/lang-map.js"></script>
  <script src="src/lang.js"></script>
  <script src="src/pinyin.js"></script>
  <script src="src/state.js"></script>
  <script src="src/srs.js"></script>
  <script src="src/session.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
